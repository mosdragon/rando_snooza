name: RandomizerAlarmClock
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  RandomizerAlarmClock:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RandomizerAlarmClock
        excludes:
          - "Resources/Info.plist"
    info:
      path: RandomizerAlarmClock/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.RandomizerAlarmClock
        PRODUCT_NAME: RandomizerAlarmClock
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
schemes:
  RandomizerAlarmClock:
    build:
      targets:
        RandomizerAlarmClock: all
    run:
      config: Debug
    archive:
      config: Release
